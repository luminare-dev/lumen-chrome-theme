# Build every preset in both modes, validate the manifests against the keys Chromium reads, draw
# the previews and the contact sheet (Pillow) and keep the theme ZIPs (artifacts "themes" and
# "previews"). The ntp job loads each theme into Playwright's Chromium and screenshots its new
# tab page (artifact "ntp-screenshots").
name: themes

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: themes-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Customizer page is up to date (presets and version embedded)
        run: python3 generator/embed.py --check

      - name: Generate all presets, dark and light
        run: python3 generator/lumen_chrome.py --all --out dist

      - name: Validate manifests, images and contrast
        run: |
          python3 generator/validate.py dist/lumen-*-dark dist/lumen-*-light dist/*.zip

      - name: Install Pillow (hash-pinned)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes --only-binary=:all: -r requirements-preview.txt

      - name: Previews and contact sheet
        run: |
          "$RUNNER_TEMP/venv/bin/python" generator/preview.py dist previews
          if ! cmp -s previews/contact-sheet.png docs/previews/contact-sheet.png; then
            echo "::notice title=previews::docs/previews/ differs from this build; copy the " \
              "previews artifact into docs/previews/"
          fi

      - name: Keep the themes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: themes
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Keep the unpacked themes (for the ntp job)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: themes-unpacked
          path: |
            dist/
            !dist/*.zip
          if-no-files-found: error
          retention-days: 3

      - name: Keep the previews
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: previews
          path: previews/
          if-no-files-found: error
          retention-days: 30

  ntp:
    name: ntp
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Take the unpacked themes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: themes-unpacked
          path: dist

      - name: New tab page in Chromium with each theme (Playwright)
        run: |
          cd ci/playwright
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium >/dev/null
          node ntp.mjs "$GITHUB_WORKSPACE/dist" "$GITHUB_WORKSPACE/ntp"

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ntp-screenshots
          path: ntp/
          if-no-files-found: warn
          retention-days: 30
